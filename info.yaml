# Tiny Tapeout project information
project:
  title:        "Project una"      # Project title
  author:       "Zeenz"            # Your name
  discord:      ""                 
  description:  "Its a basic 8 bit processor with so many instructions"      
  language:     "Verilog" 
  clock_hz:     1000000       

  # How many tiles your design occupies?
  tiles: "1x1"          

  # Your top module name must start with "tt_um_".
  top_module:  "tt_um_CPU"

  # List your project's source files here.
  source_files:
    - "una_processor_bridge.v"
    - "Complete_CPU.v"

# The pinout of your project.
pinout:
  # Inputs
  ui: "input_0"
  ui: "input_1"
  ui: "input_2"
  ui: "input_3"
  ui: "input_4"
  ui: "input_5"
  ui: "input_6"
  ui: "input_7"

  # Outputs
  uo: "output_0"
  uo: "output_1"
  uo: "output_2"
  uo: "output_3"
  uo: "output_4"
  uo: "output_5"
  uo: "output_6"
  uo: "output_7"

  # Bidirectional pins
  uio: "bidir_0"
  uio: "bidir_1"
  uio: "bidir_2"
  uio: "bidir_3"
  uio: "bidir_4"
  uio: "bidir_5"
  uio: "bidir_6"
  uio: "bidir_7"

# Do not change!
yaml_version: 6
